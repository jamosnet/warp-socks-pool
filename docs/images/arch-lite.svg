<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="Helvetica,Arial,sans-serif">
  <rect width="880" height="400" fill="#fafbfc"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">lite 版架构 — 内核 WireGuard</text>

  <rect x="30" y="150" width="150" height="80" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="105" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">客户端</text>
  <text x="105" y="204" text-anchor="middle" font-size="12" fill="#475569">passwall / 浏览器 / curl</text>

  <line x1="180" y1="190" x2="250" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="178" text-anchor="middle" font-size="11" fill="#475569">socks5/http</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="255" y="85" width="430" height="250" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="470" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">warp-lite 容器（privileged，无需 /dev/net/tun）</text>

  <rect x="275" y="130" width="180" height="60" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="365" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">gost :1080</text>
  <text x="365" y="175" text-anchor="middle" font-size="11" fill="#475569">SOCKS5 / HTTP 入口</text>

  <line x1="365" y1="190" x2="365" y2="218" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="275" y="222" width="180" height="72" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="365" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">内核 WireGuard</text>
  <text x="365" y="268" text-anchor="middle" font-size="11" fill="#475569">wg-quick + 策略路由（netns 全接管）</text>
  <text x="365" y="284" text-anchor="middle" font-size="11" fill="#475569">内核态加密，私有网段 ip rule 排除</text>

  <rect x="480" y="130" width="185" height="164" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="572" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">断线恢复</text>
  <text x="572" y="180" text-anchor="middle" font-size="11" fill="#475569">每 15s 真实 trace 体检</text>
  <text x="572" y="200" text-anchor="middle" font-size="11" fill="#475569">3 连败换端点重建，</text>
  <text x="572" y="220" text-anchor="middle" font-size="11" fill="#475569">实测通过才算修好</text>
  <text x="572" y="240" text-anchor="middle" font-size="11" fill="#475569">8 IP x 6 端口 (2408/500/</text>
  <text x="572" y="256" text-anchor="middle" font-size="11" fill="#475569">1701/4500/8443/903)</text>
  <text x="572" y="280" text-anchor="middle" font-size="11" fill="#475569">注册持久化 data/</text>

  <line x1="455" y1="258" x2="745" y2="258" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="330" text-anchor="middle" font-size="12" fill="#475569">UDP :2408 / 500 / 1701 / 4500 / 8443 / 903</text>

  <ellipse cx="795" cy="258" rx="55" ry="34" fill="#ffedd5" stroke="#f97316"/>
  <text x="795" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">Cloudflare</text>
  <text x="795" y="271" text-anchor="middle" font-size="11" fill="#9a3412">WARP 边缘</text>

  <text x="440" y="378" text-anchor="middle" font-size="12" fill="#64748b">镜像 ~127MB | 特权: privileged (sysctl src_valid_mark) | 内核态加密, CPU 占用最低</text>
</svg>
